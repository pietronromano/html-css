<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML & CSS Sandbox</title>
  </head>
  <body>
    <h1>HTML & CSS Sandbox - Images</h1>

    <!-- Relative Path -->
    <div>
      <img src="images/landscape.jpg" alt="landscape" />
    </div> 
    

    <!-- Absolute Path: picsum is a service that provides random images -->
    <div>
      <img src="https://picsum.photos/200/300" alt="Random" />
    </div>


    <div>
    <!-- Width and Height: these are normally specified with CSS, rather then in the HTML -->
     <img
      src="images/landscape.jpg"
      alt="landscape"
      width="400"
      height="300"
      title="A beautiful landscape"
    />
    </div>

    <!-- fig and figcaption -->
    <div>
      <figure>
        <img
          src="images/landscape.jpg"
          alt="Landscape"
        />
        <figcaption>Fig.1 - Beautiful landscape</figcaption>
      </figure>

  </body>
</html>

<!-- VS Code: `! + Tab` to generate basic HTML5 boilerplate -->
<!DOCTYPE html>

<html lang="en">
  <!-- Header tags do not display content on the page but provide metadata and instructions to the browser and search engines -->
  <head>
    <!-- Recommended charset is UTF-8 -->
    <meta charset="UTF-8" />
    <!-- Recommended viewport settings for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Description meta tag for SEO, shows up in search engine results below title-->
    <meta name="description" content="Learn HTML & CSS from this cool course" />
     <!-- Meta tags for search engines, although search engines no longeruse them nowadays -->
    <meta name="keywords" content="HTML, CSS, Web Development" />
    <!-- Title tag for the page, shown in browser tab and search engine results -->
    <title>HTML & CSS Sandbox</title>
  </head>
  <body>
    <!-- Main heading of the page: Recommended only one h1 tag per page -->  
    <h1>HTML & CSS Sandbox - Meta Tags</h1>
  </body>
</html>

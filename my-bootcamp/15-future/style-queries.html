<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Seasonal Card Styles</title>
  </head>

  <body>
    <!-- 
        Style queries, part of the container query specification, allow you to query the style values of a parent container based on custom properties (CSS variables). 
        In this example, we use a custom property --season to change the styles of the card based on the season value set on the parent container.
        - https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Containment/Container_size_and_style_queries#container_style_queries
    -->
    <ul class="card-container" style="--season: autumn">
      <li class="card">
        <div class="card-title">Autumn Card</div>
        <p class="card-paragraph">
          Enjoy the colors of autumn with warm and cozy tones.
        </p>
        <button class="card-button">Learn More</button>
      </li>
    </ul>
    <ul class="card-container" style="--season: summer">
      <li class="card">
        <div class="card-title">Summer Card</div>
        <p class="card-paragraph">
          Feel the warmth of summer with bright and cheerful colors.
        </p>
        <button class="card-button">Explore</button>
      </li>
    </ul>
  </body>
</html>

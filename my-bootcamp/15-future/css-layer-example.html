<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Layer Example</title>
    <style>
      /* 
        - CSS Layers allow you to organize and manage your styles by grouping them into layers.
        - Layers can be defined using the @layer rule, and their order of precedence is determined by the order in which they are declared.
        - Layer precedence takes priority over element specificity.
        - This helps in resolving conflicts between styles and makes it easier to maintain large stylesheets.
        - https://developer.mozilla.org/en-US/docs/Web/CSS/@layer
        - https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/At-rules/@layer
     */
      @layer special, theme, base;

      @layer base {
        a {
          font-weight: bold;
          color: black; /* ignored */
        }
        .nav-link {
          color: blue; /* ignored */
        }
      }

      @layer theme {
        a {
          color: purple; /* styles all links */
        }
      }

      @layer special {
        .accent {
          color: orange; /* styles all .accent elements */
        }
      }
    </style>
  </head>
  <body>
    <h1>CSS Layers Example</h1>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#" class="nav-link">About</a></li>
      <li><a href="#" class="accent">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </body>
</html>
